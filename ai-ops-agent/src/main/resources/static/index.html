<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP Market Backoffice</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div class="container">

    <header>
        <div class="logo">
            🛒
        </div>

        <div>
            <h1>JP Market Backoffice</h1>

    <main id="messages" class="messages">

        <div class="assistant">

                placeholder="Ask something like 'Why is payment-service failing?'"></textarea>

        <button id="send">
            Send
        </button>

    </footer>

</div>

<script src="/js/app.js"></script>
